<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="cache-version" content="2026-10-03-fix-missing-module">
  <title>TerDowngh — Terabox Direct Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: Inter, system-ui, sans-serif; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-xl">
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white text-xl mb-3">↓</div>
        <h1 class="text-2xl font-bold tracking-tight">TerDowngh</h1>
        <p class="mt-1 text-sm text-slate-500">Terabox Direct Downloader</p>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6">
        <form id="form" class="space-y-4">
          <div>
            <label for="urlInput" class="block text-sm font-medium mb-2">Share Link</label>
            <input id="urlInput" type="url" required
              placeholder="https://1024terabox.com/s/..."
              class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition">
          </div>

          <button id="submitBtn" type="submit"
            class="w-full h-12 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold transition">
            <span id="btnLabel">Dapatkan Link</span>
          </button>
        </form>

        <div id="errorBox" class="hidden fade mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

        <div id="loading" class="hidden fade mt-6 text-center py-5">
          <div class="mx-auto w-10 h-10 rounded-full border-4 border-slate-200 border-t-indigo-600 spin"></div>
          <p class="mt-4 text-sm font-medium text-slate-700">Mengambil link download...</p>
          <p id="loadingText" class="mt-1 text-xs text-slate-400">Browserless sedang membuka dan memproses share link.</p>
          <p id="elapsedText" class="mt-2 text-[11px] text-slate-400">0 detik</p>
        </div>

        <div id="result" class="hidden fade mt-6 border-t border-slate-100 pt-5">
          <p id="resultTitle" class="text-sm font-semibold text-slate-800 mb-3">Link Download Siap</p>
          <div id="fileList" class="space-y-3"></div>
          <button id="resetBtn" type="button" class="mt-4 w-full h-10 text-sm text-slate-500 hover:text-slate-800">Gunakan link lain</button>
        </div>
      </div>

      <p class="text-center text-xs text-slate-400 mt-5">Link download bersifat sementara sesuai Terabox.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel = document.getElementById('btnLabel');
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const elapsedText = document.getElementById('elapsedText');
    const result = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const fileList = document.getElementById('fileList');
    let loadingTimer = null;
    let loadingStartedAt = 0;

    function fmtSize(bytes) {
      if (bytes === null || bytes === undefined || isNaN(Number(bytes))) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let v = Number(bytes);
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + units[i];
    }

    function renderFiles(files) {
      fileList.innerHTML = '';
      files.forEach((f) => {
        const card = document.createElement('div');
        card.className = 'file-card rounded-xl border border-slate-200 p-3';

        const title = document.createElement('p');
        title.className = 'text-sm font-medium text-slate-800 truncate';
        title.textContent = f.filename || 'File tanpa nama';
        title.title = f.filename || '';
        card.appendChild(title);

        if (f.size !== null && f.size !== undefined) {
          const size = document.createElement('p');
          size.className = 'text-xs text-slate-400 mt-0.5';
          size.textContent = fmtSize(f.size);
          card.appendChild(size);
        }

        const row = document.createElement('div');
        row.className = 'flex gap-2 mt-2';

        const input = document.createElement('input');
        input.readOnly = true;
        input.value = f.dlink;
        input.className = 'file-link min-w-0 flex-1 h-10 px-3 rounded-lg border border-slate-200 bg-slate-50 text-xs outline-none';
        row.appendChild(input);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn px-3 h-10 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm font-medium shrink-0';
        copyBtn.textContent = 'Salin';
        row.appendChild(copyBtn);
        card.appendChild(row);

        const dl = document.createElement('a');
        dl.href = f.dlink;
        dl.target = '_blank';
        dl.rel = 'noopener noreferrer';
        dl.className = 'mt-2 w-full h-10 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center text-sm font-semibold transition';
        dl.textContent = 'Download';
        card.appendChild(dl);

        fileList.appendChild(card);
      });
    }

    function stopLoadingTimer() {
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = null;
    }

    function startLoadingTimer() {
      stopLoadingTimer();
      loadingStartedAt = Date.now();
      elapsedText.textContent = '0 detik';
      loadingTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - loadingStartedAt) / 1000);
        elapsedText.textContent = `${seconds} detik`;
        if (seconds >= 15) {
          loadingText.textContent = 'Masih diproses oleh Browserless. Jangan tutup halaman.';
        }
        if (seconds >= 30) {
          loadingText.textContent = 'Terabox membutuhkan waktu lebih lama dari biasanya. Tetap menunggu...';
        }
      }, 1000);
    }

    function showError(message) {
      stopLoadingTimer();
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      result.classList.add('hidden');
      submitBtn.disabled = false;
      btnLabel.textContent = 'Dapatkan Link';
    }

    function setLoading(active) {
      submitBtn.disabled = active;
      btnLabel.textContent = active ? 'Memproses...' : 'Dapatkan Link';
      loading.classList.toggle('hidden', !active);
      errorBox.classList.add('hidden');
      if (active) {
        result.classList.add('hidden');
        startLoadingTimer();
      } else {
        stopLoadingTimer();
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = urlInput.value.trim();

      if (!/^https?:\/\//i.test(url)) {
        showError('Masukkan link Terabox yang valid.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/terabox/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ url })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok || !data.dlink) {
          throw new Error(data.error || 'Gagal mendapatkan link download.');
        }

        const files = (Array.isArray(data.files) && data.files.length
          ? data.files
          : [{ filename: data.filename, size: null, dlink: data.dlink }]
        ).filter((f) => f && f.dlink);
        if (!files.length) {
          throw new Error('Tidak ada link download yang berhasil diekstrak.');
        }
        renderFiles(files);
        resultTitle.textContent = files.length > 1
          ? `${files.length} File Siap Didownload`
          : 'Link Download Siap';
        setLoading(false);
        result.classList.remove('hidden');
        submitBtn.disabled = false;
        btnLabel.textContent = 'Dapatkan Link';
      } catch (error) {
        showError(error.message || 'Terjadi kesalahan jaringan.');
      }
    });

    fileList.addEventListener('click', async (event) => {
      const btn = event.target.closest('.copy-btn');
      if (!btn) return;
      const card = btn.closest('.file-card');
      const input = card ? card.querySelector('.file-link') : null;
      if (!input) return;
      try {
        await navigator.clipboard.writeText(input.value);
        btn.textContent = 'Tersalin';
        setTimeout(() => { btn.textContent = 'Salin'; }, 1200);
      } catch {
        showError('Gagal menyalin link.');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      form.reset();
      result.classList.add('hidden');
      errorBox.classList.add('hidden');
      loading.classList.add('hidden');
      stopLoadingTimer();
      urlInput.focus();
    });
  </script>
</body>
</html>
