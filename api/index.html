<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="cache-version" content="2026-10-03-stream-noreferer">
  <title>TerDowngh — Terabox Direct Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    // Tema default: gelap. Pilihan user disimpan di localStorage.
    (function () {
      try {
        var saved = localStorage.getItem('terdowngh-theme');
        if (saved === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: Inter, system-ui, sans-serif; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .modal-pop { animation: pop .18s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    #themeKnob { transition: transform .2s ease; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-xl">
      <div class="text-center mb-7 relative">
        <div class="absolute right-0 top-0">
          <button id="themeToggle" type="button" role="switch" aria-checked="true" aria-label="Ganti tema gelap/terang"
            class="relative inline-flex h-8 w-14 items-center rounded-full bg-slate-800 dark:bg-slate-700 transition-colors"
            title="Ganti tema">
            <span id="themeIconSun" class="absolute left-2 text-amber-300 hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            <span id="themeIconMoon" class="absolute right-2 text-slate-300">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </span>
            <span id="themeKnob" class="absolute left-1 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow translate-x-6">
              <svg id="knobMoon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg id="knobSun" class="hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
          </button>
        </div>
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white text-xl mb-3">↓</div>
        <h1 class="text-2xl font-bold tracking-tight">TerDowngh</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Terabox Direct Downloader</p>
      </div>

      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-5 sm:p-6 transition-colors">
        <form id="form" class="space-y-4">
          <div>
            <label for="urlInput" class="block text-sm font-medium mb-2">Share Link</label>
            <input id="urlInput" type="url" required
              placeholder="https://1024terabox.com/s/..."
              class="w-full h-12 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition">
          </div>

          <button id="submitBtn" type="submit"
            class="w-full h-12 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold transition">
            <span id="btnLabel">Dapatkan Link</span>
          </button>
        </form>

        <div id="errorBox" class="hidden fade mt-4 rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/50 px-4 py-3 text-sm text-red-700 dark:text-red-300"></div>

        <div id="loading" class="hidden fade mt-6 text-center py-5">
          <div class="mx-auto w-10 h-10 rounded-full border-4 border-slate-200 dark:border-slate-700 border-t-indigo-600 spin"></div>
          <p class="mt-4 text-sm font-medium text-slate-700 dark:text-slate-300">Mengambil link download...</p>
          <p id="loadingText" class="mt-1 text-xs text-slate-400 dark:text-slate-500">Browserless sedang membuka dan memproses share link.</p>
          <p id="elapsedText" class="mt-2 text-[11px] text-slate-400 dark:text-slate-500">0 detik</p>
        </div>

        <div id="result" class="hidden fade mt-6 border-t border-slate-100 dark:border-slate-800 pt-5">
          <p id="resultTitle" class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">Link Download Siap</p>
          <div id="fileList" class="space-y-3"></div>
          <button id="resetBtn" type="button" class="mt-4 w-full h-10 text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">Gunakan link lain</button>
        </div>
      </div>

      <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-5">Link download bersifat sementara sesuai Terabox.</p>
    </section>
  </main>

  <!-- Modal streaming -->
  <div id="streamModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="streamBackdrop" class="absolute inset-0 bg-black/75"></div>
    <div class="modal-pop relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-2xl">
      <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-200 dark:border-slate-800">
        <p id="streamTitle" class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">Streaming</p>
        <button id="streamClose" type="button" aria-label="Tutup"
          class="shrink-0 w-8 h-8 rounded-full border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 flex items-center justify-center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <video id="streamVideo" class="w-full max-h-[70vh] bg-black" controls playsinline preload="metadata" referrerpolicy="no-referrer"></video>
      <p id="streamError" class="hidden px-4 py-3 text-sm text-red-600 dark:text-red-400"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel = document.getElementById('btnLabel');
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const elapsedText = document.getElementById('elapsedText');
    const result = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const fileList = document.getElementById('fileList');
    let loadingTimer = null;
    let loadingStartedAt = 0;

    // ---------- Tema ----------
    const themeToggle = document.getElementById('themeToggle');
    const themeKnob = document.getElementById('themeKnob');
    const knobMoon = document.getElementById('knobMoon');
    const knobSun = document.getElementById('knobSun');
    const themeIconMoon = document.getElementById('themeIconMoon');
    const themeIconSun = document.getElementById('themeIconSun');

    function paintThemeToggle() {
      const dark = document.documentElement.classList.contains('dark');
      themeToggle.setAttribute('aria-checked', String(dark));
      themeKnob.style.transform = dark ? 'translateX(1.5rem)' : 'translateX(0)';
      knobMoon.classList.toggle('hidden', !dark);
      knobSun.classList.toggle('hidden', dark);
      themeIconMoon.classList.toggle('hidden', !dark);
      themeIconSun.classList.toggle('hidden', dark);
    }
    function setTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      try { localStorage.setItem('terdowngh-theme', dark ? 'dark' : 'light'); } catch (e) {}
      paintThemeToggle();
    }
    themeToggle.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('dark'));
    });
    paintThemeToggle();

    // ---------- Util ----------
    function stopLoadingTimer() {
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = null;
    }

    function startLoadingTimer() {
      stopLoadingTimer();
      loadingStartedAt = Date.now();
      elapsedText.textContent = '0 detik';
      loadingTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - loadingStartedAt) / 1000);
        elapsedText.textContent = `${seconds} detik`;
        if (seconds >= 15) {
          loadingText.textContent = 'Masih diproses oleh Browserless. Jangan tutup halaman.';
        }
        if (seconds >= 30) {
          loadingText.textContent = 'Terabox membutuhkan waktu lebih lama dari biasanya. Tetap menunggu...';
        }
      }, 1000);
    }

    function showError(message) {
      stopLoadingTimer();
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      result.classList.add('hidden');
      submitBtn.disabled = false;
      btnLabel.textContent = 'Dapatkan Link';
    }

    function setLoading(active) {
      submitBtn.disabled = active;
      btnLabel.textContent = active ? 'Memproses...' : 'Dapatkan Link';
      loading.classList.toggle('hidden', !active);
      errorBox.classList.add('hidden');
      if (active) {
        result.classList.add('hidden');
        startLoadingTimer();
      } else {
        stopLoadingTimer();
      }
    }

    function fmtSize(bytes) {
      if (bytes === null || bytes === undefined || isNaN(Number(bytes))) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let v = Number(bytes);
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + units[i];
    }

    function fileKind(filename) {
      const ext = String(filename || '').split('.').pop().toLowerCase().split('?')[0];
      if (['mp4', 'mkv', 'webm', 'mov', 'avi', 'm4v', 'ts', 'flv', '3gp'].includes(ext)) return 'video';
      if (['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'opus'].includes(ext)) return 'audio';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return 'image';
      return 'other';
    }

    function kindIcon(kind) {
      const svg = (paths) =>
        `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
      const wrap = document.createElement('span');
      wrap.className = 'text-slate-400 dark:text-slate-500';
      if (kind === 'video') wrap.innerHTML = svg('<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/>');
      else if (kind === 'audio') wrap.innerHTML = svg('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>');
      else if (kind === 'image') wrap.innerHTML = svg('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>');
      else wrap.innerHTML = svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>');
      return wrap;
    }

    function renderFiles(files) {
      fileList.innerHTML = '';
      files.forEach((f) => {
        const kind = fileKind(f.filename);

        const card = document.createElement('div');
        card.className = 'file-card rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 transition-colors';

        const top = document.createElement('div');
        top.className = 'flex gap-3 items-center';

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'w-14 h-14 rounded-lg overflow-hidden bg-slate-100 dark:bg-slate-800 shrink-0 flex items-center justify-center';
        if (f.thumb) {
          const img = document.createElement('img');
          img.src = f.thumb;
          img.alt = '';
          img.loading = 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.className = 'w-full h-full object-cover';
          img.onerror = () => { img.remove(); thumbWrap.appendChild(kindIcon(kind)); };
          thumbWrap.appendChild(img);
        } else {
          thumbWrap.appendChild(kindIcon(kind));
        }
        top.appendChild(thumbWrap);

        const meta = document.createElement('div');
        meta.className = 'min-w-0 flex-1';
        const title = document.createElement('p');
        title.className = 'text-sm font-medium text-slate-800 dark:text-slate-200 truncate';
        title.textContent = f.filename || 'File tanpa nama';
        title.title = f.filename || '';
        meta.appendChild(title);
        const size = fmtSize(f.size);
        if (size) {
          const sizeEl = document.createElement('p');
          sizeEl.className = 'text-xs text-slate-400 dark:text-slate-500 mt-0.5';
          sizeEl.textContent = size;
          meta.appendChild(sizeEl);
        }
        top.appendChild(meta);
        card.appendChild(top);

        const row = document.createElement('div');
        row.className = 'flex gap-2 mt-3';

        const input = document.createElement('input');
        input.readOnly = true;
        input.value = f.dlink;
        input.className = 'file-link min-w-0 flex-1 h-10 px-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-xs outline-none';
        row.appendChild(input);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn px-3 h-10 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm font-medium shrink-0 transition-colors';
        copyBtn.textContent = 'Salin';
        row.appendChild(copyBtn);
        card.appendChild(row);

        const actions = document.createElement('div');
        actions.className = 'flex gap-2 mt-2';

        if (kind === 'video' || kind === 'audio') {
          const playBtn = document.createElement('button');
          playBtn.type = 'button';
          playBtn.className = 'play-btn flex-1 h-10 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center gap-2 text-sm font-semibold transition';
          playBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>Streaming</span>';
          playBtn.addEventListener('click', () => openStream(f));
          actions.appendChild(playBtn);
        }

        const dl = document.createElement('a');
        dl.href = f.dlink;
        dl.target = '_blank';
        dl.rel = 'noopener noreferrer';
        dl.className = 'flex-1 h-10 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center text-sm font-semibold transition';
        dl.textContent = 'Download';
        actions.appendChild(dl);

        card.appendChild(actions);
        fileList.appendChild(card);
      });
    }

    // ---------- Modal streaming ----------
    const streamModal = document.getElementById('streamModal');
    const streamTitle = document.getElementById('streamTitle');
    const streamVideo = document.getElementById('streamVideo');
    const streamError = document.getElementById('streamError');

    let streamFile = null;
    let streamRetried = false;
    let hlsInstance = null;

    // Bangun playlist M3U8 dari data chunks backend, dengan URL chunk
    // yang di-proxy via /api/hls-chunk (agar cookie NDUS terpasang server-side).
    function buildHlsBlobUrl(hlsData) {
      if (!hlsData || !Array.isArray(hlsData.chunks) || !hlsData.chunks.length) return null;
      const chunks = hlsData.chunks;
      const maxDur = Math.ceil(Math.max.apply(null, chunks.map(function (c) { return c.dur || 10; })));
      let m3u8 = "#EXTM3U\n#EXT-X-VERSION:3\n";
      m3u8 += "#EXT-X-TARGETDURATION:" + maxDur + "\n";
      m3u8 += "#EXT-X-MEDIA-SEQUENCE:" + (chunks[0].seq || 0) + "\n";
      for (const c of chunks) {
        const enc = btoa(c.url).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        m3u8 += "#EXTINF:" + (c.dur || 10) + ",\n";
        m3u8 += "/api/hls-chunk?u=" + enc + "\n";
      }
      m3u8 += "#EXT-X-ENDLIST\n";
      const blob = new Blob([m3u8], { type: "application/vnd.apple.mpegurl" });
      return URL.createObjectURL(blob);
    }

    function openStream(file) {
      streamFile = file;
      streamRetried = false;
      streamTitle.textContent = file.filename || 'Streaming';
      streamError.classList.add('hidden');
      streamError.textContent = '';
      streamModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      // Prioritas 1: HLS via /share/streaming (jalur resmi, lolos 31045)
      const hlsData = window._hlsData;
      const hlsUrl = buildHlsBlobUrl(hlsData);
      if (hlsUrl) {
        if (window.Hls && Hls.isSupported()) {
          try {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            const hls = new Hls({ maxBufferLength: 60 });
            hlsInstance = hls;
            hls.on(Hls.Events.ERROR, function (ev, data) {
              if (data && data.fatal) {
                try { hls.destroy(); } catch (_) {}
                hlsInstance = null;
                streamVideo.src = file.dlink;
                streamVideo.load();
                streamVideo.play().catch(() => {});
              }
            });
            hls.loadSource(hlsUrl);
            hls.attachMedia(streamVideo);
            streamVideo.play().catch(() => {});
            return;
          } catch (_) { /* jatuh ke fallback */ }
        } else if (streamVideo.canPlayType('application/vnd.apple.mpegurl')) {
          streamVideo.src = hlsUrl;
          streamVideo.play().catch(() => {});
          return;
        }
      }
      // Prioritas 2 (fallback): dlink langsung (cara lama)
      streamVideo.setAttribute('referrerpolicy', 'no-referrer');
      streamVideo.src = file.dlink;
      streamVideo.play().catch(() => {});
    }

    function closeStream() {
      streamVideo.pause();
      try { if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; } } catch (_) {}
      streamVideo.removeAttribute('src');
      streamVideo.load();
      streamModal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.getElementById('streamClose').addEventListener('click', closeStream);
    document.getElementById('streamBackdrop').addEventListener('click', closeStream);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !streamModal.classList.contains('hidden')) closeStream();
    });
    streamVideo.addEventListener('error', () => {
      // Fallback: coba sekali lagi dengan Referer normal, siapa tahu
      // CDN-nya justru membutuhkan Referer.
      if (streamFile && !streamRetried) {
        streamRetried = true;
        streamVideo.removeAttribute('referrerpolicy');
        streamVideo.src = streamFile.dlink;
        streamVideo.load();
        streamVideo.play().catch(() => {});
        return;
      }
      streamError.textContent = 'Gagal memuat stream. Link mungkin sudah kedaluwarsa atau dibatasi server — coba buat link baru, atau pakai tombol Download.';
      streamError.classList.remove('hidden');
    });

    // ---------- Form ----------
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = urlInput.value.trim();

      if (!/^https?:\/\//i.test(url)) {
        showError('Masukkan link Terabox yang valid.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/terabox/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ url })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok || !data.dlink) {
          throw new Error(data.error || 'Gagal mendapatkan link download.');
        }
        // Simpan data HLS untuk streaming via hls.js
        window._hlsData = data.hls || null;

        const files = (Array.isArray(data.files) && data.files.length
          ? data.files
          : [{ filename: data.filename, size: null, dlink: data.dlink, thumb: data.thumb || null }]
        ).filter((f) => f && f.dlink);
        if (!files.length) {
          throw new Error('Tidak ada link download yang berhasil diekstrak.');
        }
        renderFiles(files);
        resultTitle.textContent = files.length > 1
          ? `${files.length} File Siap Didownload`
          : 'Link Download Siap';
        setLoading(false);
        result.classList.remove('hidden');
        submitBtn.disabled = false;
        btnLabel.textContent = 'Dapatkan Link';
      } catch (error) {
        showError(error.message || 'Terjadi kesalahan jaringan.');
      }
    });

    fileList.addEventListener('click', async (event) => {
      const btn = event.target.closest('.copy-btn');
      if (!btn) return;
      const card = btn.closest('.file-card');
      const input = card ? card.querySelector('.file-link') : null;
      if (!input) return;
      try {
        await navigator.clipboard.writeText(input.value);
        btn.textContent = 'Tersalin';
        setTimeout(() => { btn.textContent = 'Salin'; }, 1200);
      } catch {
        showError('Gagal menyalin link.');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      form.reset();
      result.classList.add('hidden');
      errorBox.classList.add('hidden');
      loading.classList.add('hidden');
      stopLoadingTimer();
      urlInput.focus();
    });
  </script>
</body>
</html>
