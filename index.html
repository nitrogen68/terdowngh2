<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="cache-version" content="2026-10-03-stream-noreferer">
  <title>TerDowngh — Terabox Direct Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    // Tema default: gelap. Pilihan user disimpan di localStorage.
    (function () {
      try {
        var saved = localStorage.getItem('terdowngh-theme');
        if (saved === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: Inter, system-ui, sans-serif; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .modal-pop { animation: pop .22s cubic-bezier(.16,1,.3,1); }
    @keyframes pop { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    #themeKnob { transition: transform .2s ease; }
    /* Kartu file premium */
    .file-card { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .file-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -12px rgba(99,102,241,.35); border-color: rgba(99,102,241,.45); }
    .file-card .play-btn { transition: transform .15s ease, box-shadow .15s ease; }
    .file-card .play-btn:hover { transform: scale(1.03); box-shadow: 0 8px 20px -6px rgba(99,102,241,.6); }
    .file-card .play-btn:active { transform: scale(.98); }
    /* Spinner loading elegan */
    .loader-ring { width: 56px; height: 56px; border-radius: 9999px;
      background: conic-gradient(from 0deg, #6366f1, #a855f7, #ec4899, #6366f1);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      animation: spin 1s linear infinite; }
    .pulse-dot { animation: pdot 1.4s ease-in-out infinite; }
    @keyframes pdot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    /* Progress download */
    .dl-bar { transition: width .25s ease; }
    /* Modal player */
    .player-glow { box-shadow: 0 0 0 1px rgba(99,102,241,.25), 0 25px 70px -20px rgba(99,102,241,.45); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-xl">
      <div class="text-center mb-7 relative">
        <div class="absolute right-0 top-0">
          <button id="themeToggle" type="button" role="switch" aria-checked="true" aria-label="Ganti tema gelap/terang"
            class="relative inline-flex h-8 w-14 items-center rounded-full bg-slate-800 dark:bg-slate-700 transition-colors"
            title="Ganti tema">
            <span id="themeIconSun" class="absolute left-2 text-amber-300 hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            <span id="themeIconMoon" class="absolute right-2 text-slate-300">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </span>
            <span id="themeKnob" class="absolute left-1 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow translate-x-6">
              <svg id="knobMoon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg id="knobSun" class="hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
          </button>
        </div>
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-3xl bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white text-2xl mb-4 shadow-xl shadow-indigo-600/30">↓</div>
        <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 bg-clip-text text-transparent">TerDowngh</h1>
        <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400">Terabox Direct Downloader & Streaming</p>
      </div>

      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-5 sm:p-6 transition-colors">
        <form id="form" class="space-y-4">
          <div>
            <label for="urlInput" class="block text-sm font-medium mb-2">Share Link</label>
            <input id="urlInput" type="url" required
              placeholder="https://1024terabox.com/s/..."
              class="w-full h-12 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition">
          </div>

          <button id="submitBtn" type="submit"
            class="w-full h-12 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold transition">
            <span id="btnLabel">Dapatkan Link</span>
          </button>
        </form>

        <div id="errorBox" class="hidden fade mt-4 rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/50 px-4 py-3 text-sm text-red-700 dark:text-red-300"></div>

        <div id="loading" class="hidden fade mt-6 text-center py-5">
          <div class="mx-auto w-10 h-10 rounded-full border-4 border-slate-200 dark:border-slate-700 border-t-indigo-600 spin"></div>
          <p class="mt-4 text-sm font-medium text-slate-700 dark:text-slate-300">Mengambil link download...</p>
          <p id="loadingText" class="mt-1 text-xs text-slate-400 dark:text-slate-500">Browserless sedang membuka dan memproses share link.</p>
          <p id="elapsedText" class="mt-2 text-[11px] text-slate-400 dark:text-slate-500">0 detik</p>
        </div>

        <div id="result" class="hidden fade mt-6 border-t border-slate-100 dark:border-slate-800 pt-5">
          <p id="resultTitle" class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">Link Download Siap</p>
          <div id="fileList" class="space-y-3"></div>
          <button id="resetBtn" type="button" class="mt-4 w-full h-10 text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">Gunakan link lain</button>
        </div>
      </div>

      <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-5">Link download bersifat sementara sesuai Terabox.</p>
    </section>
  </main>

  <!-- Custom player modal -->
  <div id="streamModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6">
    <div id="streamBackdrop" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
    <div class="modal-pop player-glow relative w-full max-w-3xl bg-slate-900 rounded-3xl overflow-hidden">
      <!-- Header -->
      <div class="flex items-center gap-3 px-4 sm:px-5 py-3.5 bg-gradient-to-r from-indigo-600/20 via-violet-600/10 to-fuchsia-600/20 border-b border-white/10">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p id="streamTitle" class="text-sm font-semibold text-white truncate">Streaming</p>
          <p id="streamMode" class="text-[11px] text-indigo-300/80 truncate"></p>
        </div>
        <button id="streamClose" type="button" aria-label="Tutup"
          class="shrink-0 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white/80 flex items-center justify-center transition">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <!-- Video area + loading overlay -->
      <div class="relative bg-black">
        <video id="streamVideo" class="w-full max-h-[62vh] bg-black" controls playsinline preload="metadata" referrerpolicy="no-referrer"></video>
        <div id="streamLoading" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black/60 backdrop-blur-[2px]">
          <div class="loader-ring"></div>
          <p class="text-sm font-medium text-white/90">Memuat stream<span class="pulse-dot">...</span></p>
          <p id="streamLoadingSub" class="text-[11px] text-white/50">Menyiapkan segmen video</p>
        </div>
      </div>
      <!-- Action bar -->
      <div class="px-4 sm:px-5 py-4 bg-slate-900">
        <div id="dlProgressWrap" class="hidden mb-3">
          <div class="flex justify-between text-[11px] text-white/60 mb-1.5">
            <span id="dlProgressLabel">Mengunduh...</span>
            <span id="dlProgressPct">0%</span>
          </div>
          <div class="h-1.5 rounded-full bg-white/10 overflow-hidden">
            <div id="dlProgressBar" class="dl-bar h-full w-0 rounded-full bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500"></div>
          </div>
        </div>
        <div class="flex gap-2.5">
          <button id="modalDownloadBtn" type="button"
            class="flex-1 h-11 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 disabled:cursor-wait text-white text-sm font-semibold flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-600/30">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            <span id="modalDownloadLabel">Download Video</span>
          </button>
          <button id="modalCloseBtn" type="button"
            class="h-11 px-5 rounded-xl bg-white/10 hover:bg-white/15 text-white/80 text-sm font-medium transition">Tutup</button>
        </div>
        <p id="streamError" class="hidden mt-3 text-sm text-red-400"></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel = document.getElementById('btnLabel');
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const elapsedText = document.getElementById('elapsedText');
    const result = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const fileList = document.getElementById('fileList');
    let loadingTimer = null;
    let loadingStartedAt = 0;

    // ---------- Tema ----------
    const themeToggle = document.getElementById('themeToggle');
    const themeKnob = document.getElementById('themeKnob');
    const knobMoon = document.getElementById('knobMoon');
    const knobSun = document.getElementById('knobSun');
    const themeIconMoon = document.getElementById('themeIconMoon');
    const themeIconSun = document.getElementById('themeIconSun');

    function paintThemeToggle() {
      const dark = document.documentElement.classList.contains('dark');
      themeToggle.setAttribute('aria-checked', String(dark));
      themeKnob.style.transform = dark ? 'translateX(1.5rem)' : 'translateX(0)';
      knobMoon.classList.toggle('hidden', !dark);
      knobSun.classList.toggle('hidden', dark);
      themeIconMoon.classList.toggle('hidden', !dark);
      themeIconSun.classList.toggle('hidden', dark);
    }
    function setTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      try { localStorage.setItem('terdowngh-theme', dark ? 'dark' : 'light'); } catch (e) {}
      paintThemeToggle();
    }
    themeToggle.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('dark'));
    });
    paintThemeToggle();

    // ---------- Util ----------
    function stopLoadingTimer() {
      if (loadingTimer) clearInterval(loadingTimer);
      loadingTimer = null;
    }

    function startLoadingTimer() {
      stopLoadingTimer();
      loadingStartedAt = Date.now();
      elapsedText.textContent = '0 detik';
      loadingTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - loadingStartedAt) / 1000);
        elapsedText.textContent = `${seconds} detik`;
        if (seconds >= 15) {
          loadingText.textContent = 'Masih diproses oleh Browserless. Jangan tutup halaman.';
        }
        if (seconds >= 30) {
          loadingText.textContent = 'Terabox membutuhkan waktu lebih lama dari biasanya. Tetap menunggu...';
        }
      }, 1000);
    }

    function showError(message) {
      stopLoadingTimer();
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      result.classList.add('hidden');
      submitBtn.disabled = false;
      btnLabel.textContent = 'Dapatkan Link';
    }

    function setLoading(active) {
      submitBtn.disabled = active;
      btnLabel.textContent = active ? 'Memproses...' : 'Dapatkan Link';
      loading.classList.toggle('hidden', !active);
      errorBox.classList.add('hidden');
      if (active) {
        result.classList.add('hidden');
        startLoadingTimer();
      } else {
        stopLoadingTimer();
      }
    }

    function fmtSize(bytes) {
      if (bytes === null || bytes === undefined || isNaN(Number(bytes))) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let v = Number(bytes);
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + units[i];
    }

    function fileKind(filename) {
      const ext = String(filename || '').split('.').pop().toLowerCase().split('?')[0];
      if (['mp4', 'mkv', 'webm', 'mov', 'avi', 'm4v', 'ts', 'flv', '3gp'].includes(ext)) return 'video';
      if (['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'opus'].includes(ext)) return 'audio';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return 'image';
      return 'other';
    }

    function kindIcon(kind) {
      const svg = (paths) =>
        `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
      const wrap = document.createElement('span');
      wrap.className = 'text-slate-400 dark:text-slate-500';
      if (kind === 'folder') { wrap.className = 'text-amber-500 dark:text-amber-400'; wrap.innerHTML = svg('<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>'); }
      else if (kind === 'video') wrap.innerHTML = svg('<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/>');
      else if (kind === 'audio') wrap.innerHTML = svg('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>');
      else if (kind === 'image') wrap.innerHTML = svg('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>');
      else wrap.innerHTML = svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>');
      return wrap;
    }

    function renderFiles(files) {
      fileList.innerHTML = '';
      files.forEach((f) => {
        const isFolder = Number(f.isdir || 0) === 1;
        const kind = isFolder ? 'folder' : fileKind(f.filename);

        const card = document.createElement('div');
        card.className = 'file-card rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4' + (isFolder ? ' cursor-pointer' : '');
        if (isFolder) {
          card.addEventListener('click', () => openFolder(f));
          card.title = 'Buka folder';
        }

        const top = document.createElement('div');
        top.className = 'flex gap-3.5 items-center';

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'w-16 h-16 rounded-xl overflow-hidden bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700 shrink-0 flex items-center justify-center';
        if (f.thumb) {
          const img = document.createElement('img');
          img.src = f.thumb;
          img.alt = '';
          img.loading = 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.className = 'w-full h-full object-cover';
          img.onerror = () => { img.remove(); thumbWrap.appendChild(kindIcon(kind)); };
          thumbWrap.appendChild(img);
        } else {
          thumbWrap.appendChild(kindIcon(kind));
        }
        top.appendChild(thumbWrap);

        const meta = document.createElement('div');
        meta.className = 'min-w-0 flex-1';
        const title = document.createElement('p');
        title.className = 'text-sm font-semibold text-slate-800 dark:text-slate-100 truncate';
        title.textContent = f.filename || 'File tanpa nama';
        title.title = f.filename || '';
        meta.appendChild(title);
        const sub = document.createElement('div');
        sub.className = 'flex items-center gap-2 mt-1';
        const kindBadge = document.createElement('span');
        kindBadge.className = 'text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ' +
          (kind === 'folder' ? 'bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300'
            : kind === 'video' ? 'bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300'
            : kind === 'audio' ? 'bg-violet-100 dark:bg-violet-500/20 text-violet-700 dark:text-violet-300'
            : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400');
        kindBadge.textContent = kind === 'folder' ? 'Folder' : kind === 'video' ? 'Video' : kind === 'audio' ? 'Audio' : kind === 'image' ? 'Gambar' : 'File';
        sub.appendChild(kindBadge);
        const size = fmtSize(f.size);
        if (size) {
          const sizeEl = document.createElement('span');
          sizeEl.className = 'text-xs text-slate-400 dark:text-slate-500';
          sizeEl.textContent = size;
          sub.appendChild(sizeEl);
        }
        meta.appendChild(sub);
        top.appendChild(meta);

        if (kind === 'video' || kind === 'audio') {
          const playBtn = document.createElement('button');
          playBtn.type = 'button';
          playBtn.className = 'play-btn shrink-0 w-12 h-12 rounded-full bg-gradient-to-br from-indigo-600 to-violet-600 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30';
          playBtn.setAttribute('aria-label', 'Putar ' + (f.filename || 'file'));
          playBtn.title = 'Streaming';
          playBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
          playBtn.addEventListener('click', () => openStream(f));
          top.appendChild(playBtn);
        }

        card.appendChild(top);
        fileList.appendChild(card);
      });
    }


    // Download via HLS chunks (lolos 31045): ambil semua segmen via proxy,
    // gabung jadi satu file .ts yang bisa diputar.
    // URL share disimpan untuk fetch HLS per-file bila diperlukan.
    let currentShareUrl = '';
    let currentPath = ''; // path folder saat ini, '' = root
    let pathHistory = []; // untuk tombol kembali

    // Buka folder: fetch isi folder via backend dengan param path.
    async function openFolder(folder) {
      const folderPath = folder.path || ('/' + (folder.filename || ''));
      pathHistory.push(currentPath);
      currentPath = folderPath;
      await fetchFiles(currentShareUrl, folderPath);
      renderBreadcrumb();
    }

    // Kembali ke folder sebelumnya.
    async function goBack() {
      if (!pathHistory.length) return;
      currentPath = pathHistory.pop();
      await fetchFiles(currentShareUrl, currentPath);
      renderBreadcrumb();
    }

    // Tampilkan breadcrumb navigasi folder.
    function renderBreadcrumb() {
      let bc = document.getElementById('breadcrumb');
      if (!bc) {
        bc = document.createElement('div');
        bc.id = 'breadcrumb';
        bc.className = 'flex items-center gap-2 mb-3 text-sm';
        fileList.parentNode.insertBefore(bc, fileList);
      }
      bc.innerHTML = '';
      if (!currentPath && !pathHistory.length) { bc.style.display = 'none'; return; }
      bc.style.display = 'flex';
      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-700';
      backBtn.textContent = '← Kembali';
      backBtn.addEventListener('click', goBack);
      bc.appendChild(backBtn);
      const label = document.createElement('span');
      label.className = 'text-slate-500 dark:text-slate-400 text-xs truncate';
      label.textContent = currentPath || '/';
      bc.appendChild(label);
    }

    // Fetch daftar file (root atau folder tertentu).
    async function fetchFiles(shareUrl, path) {
      fileList.innerHTML = '<div class="text-center py-8 text-slate-400">Memuat...</div>';
      try {
        const body = { url: shareUrl };
        if (path) body.path = path;
        const res = await fetch('/api/terabox/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const files = data.files || [];
        window._hlsData = data.hls || null;
        renderFiles(files);
      } catch (e) {
        fileList.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">Gagal: ' + (e.message || e) + '</div>';
      }
    }

    // Ambil data HLS untuk file tertentu. Pakai cache bila fid cocok,
    // jika tidak fetch ke backend dengan fid file tersebut.
    async function getHlsForFile(file) {
      const cached = window._hlsData;
      if (cached && cached.fid && file && file.fs_id &&
          String(cached.fid) === String(file.fs_id) &&
          Array.isArray(cached.chunks) && cached.chunks.length) {
        return cached;
      }
      if (!file || !file.fs_id || !currentShareUrl) return cached;
      try {
        const resp = await fetch('/api/terabox/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ url: currentShareUrl, fid: String(file.fs_id) })
        });
        const data = await resp.json().catch(() => ({}));
        if (data && data.ok && data.hls && Array.isArray(data.hls.chunks) && data.hls.chunks.length) {
          window._hlsData = data.hls;
          return data.hls;
        }
      } catch (_) { /* fallback ke cache */ }
      return cached;
    }

    async function downloadViaHls(file, ui) {
      // ui: { label(text), bar(pct), wrap(show/hide), btn(disable) }
      const hlsData = await getHlsForFile(file);
      if (!hlsData || !Array.isArray(hlsData.chunks) || !hlsData.chunks.length) return false;
      const setProgress = (i, total, phase) => {
        if (!ui) return;
        const pct = total ? Math.round(((i) / total) * 100) : 0;
        if (ui.wrap) ui.wrap.classList.remove('hidden');
        if (ui.bar) ui.bar.style.width = pct + '%';
        if (ui.pct) ui.pct.textContent = pct + '%';
        const txt = phase === 'merge' ? 'Menggabungkan...' : ('Mengunduh ' + Math.min(i + 1, total) + '/' + total);
        if (ui.plabel) ui.plabel.textContent = txt;
        if (ui.label) ui.label.textContent = phase === 'merge' ? 'Menggabungkan...' : 'Mengunduh...';
      };
      try {
        if (ui && ui.btn) ui.btn.disabled = true;
        const chunks = hlsData.chunks;
        const parts = new Array(chunks.length);
        let completed = 0;
        const CONCURRENCY = 6; // download paralel agar jauh lebih cepat
        async function fetchOne(i) {
          const enc = btoa(chunks[i].url).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          const chunkUrl = window.location.origin + "/api/hls-chunk?u=" + enc;
          let buf = null;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const resp = await fetch(chunkUrl);
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              buf = await resp.arrayBuffer();
              if (buf.byteLength > 0) break;
              throw new Error('chunk kosong');
            } catch (e) {
              if (attempt === 2) throw new Error('chunk ' + i + ' gagal setelah 3x: ' + e.message);
              await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
            }
          }
          parts[i] = buf;
          completed++;
          setProgress(completed, chunks.length);
        }
        for (let s = 0; s < chunks.length; s += CONCURRENCY) {
          const batch = [];
          for (let i = s; i < Math.min(s + CONCURRENCY, chunks.length); i++) batch.push(fetchOne(i));
          await Promise.all(batch);
        }
        setProgress(chunks.length, chunks.length, 'merge');
        const blob = new Blob(parts, { type: "video/mp2t" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const base = (file.filename || 'video').replace(/\.[a-z0-9]+$/i, '');
        a.download = base + '.ts';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
        if (ui) {
          if (ui.label) ui.label.textContent = 'Download Video';
          if (ui.wrap) setTimeout(() => ui.wrap.classList.add('hidden'), 1500);
          if (ui.bar) setTimeout(() => { ui.bar.style.width = '0%'; }, 1500);
          if (ui.pct) ui.pct.textContent = '0%';
          if (ui.btn) ui.btn.disabled = false;
        }
        return true;
      } catch (e) {
        if (ui) {
          if (ui.label) ui.label.textContent = 'Download Video';
          if (ui.btn) ui.btn.disabled = false;
        }
        return false;
      }
    }

    // ---------- Custom player modal ----------
    const streamModal = document.getElementById('streamModal');
    const streamTitle = document.getElementById('streamTitle');
    const streamVideo = document.getElementById('streamVideo');
    const streamError = document.getElementById('streamError');
    const streamLoading = document.getElementById('streamLoading');
    const streamLoadingSub = document.getElementById('streamLoadingSub');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');
    const modalDownloadLabel = document.getElementById('modalDownloadLabel');
    const dlProgressWrap = document.getElementById('dlProgressWrap');
    const dlProgressBar = document.getElementById('dlProgressBar');
    const dlProgressLabel = document.getElementById('dlProgressLabel');
    const dlProgressPct = document.getElementById('dlProgressPct');

    let streamFile = null;
    let streamRetried = false;
    let hlsInstance = null;

    function showStreamLoading(sub) {
      if (streamLoadingSub && sub) streamLoadingSub.textContent = sub;
      streamLoading.classList.remove('hidden');
    }
    function hideStreamLoading() {
      streamLoading.classList.add('hidden');
    }
    // Sembunyikan overlay loading begitu video benar-benar berputar
    streamVideo.addEventListener('playing', hideStreamLoading);
    streamVideo.addEventListener('waiting', () => {
      if (!streamModal.classList.contains('hidden')) showStreamLoading('Buffering...');
    });

    // Bangun playlist M3U8 dari data chunks backend, dengan URL chunk
    // yang di-proxy via /api/hls-chunk (agar cookie NDUS terpasang server-side).
    function buildHlsBlobUrl(hlsData) {
      if (!hlsData || !Array.isArray(hlsData.chunks) || !hlsData.chunks.length) return null;
      const chunks = hlsData.chunks;
      const maxDur = Math.ceil(Math.max.apply(null, chunks.map(function (c) { return c.dur || 10; })));
      let m3u8 = "#EXTM3U\n#EXT-X-VERSION:3\n";
      m3u8 += "#EXT-X-TARGETDURATION:" + maxDur + "\n";
      m3u8 += "#EXT-X-MEDIA-SEQUENCE:" + (chunks[0].seq || 0) + "\n";
      for (const c of chunks) {
        const enc = btoa(c.url).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        m3u8 += "#EXTINF:" + (c.dur || 10) + ",\n";
        m3u8 += window.location.origin + "/api/hls-chunk?u=" + enc + "\n";
      }
      m3u8 += "#EXT-X-ENDLIST\n";
      const blob = new Blob([m3u8], { type: "application/vnd.apple.mpegurl" });
      return URL.createObjectURL(blob);
    }

    async function openStream(file) {
      streamFile = file;
      streamRetried = false;
      streamTitle.textContent = file.filename || 'Streaming';
      streamError.classList.add('hidden');
      streamError.textContent = '';
      streamModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      // Reset UI download modal
      dlProgressWrap.classList.add('hidden');
      dlProgressBar.style.width = '0%';
      dlProgressPct.textContent = '0%';
      modalDownloadLabel.textContent = 'Download Video';
      modalDownloadBtn.disabled = false;
      showStreamLoading('Menyiapkan segmen video');
      const modeEl = document.getElementById('streamMode');
      if (modeEl) modeEl.textContent = 'Menyiapkan stream...';
      // Prioritas 1: HLS via /share/streaming (jalur resmi, lolos 31045)
      // Ambil HLS khusus untuk file ini (bukan cache file pertama).
      const hlsData = await getHlsForFile(file);
      const hlsUrl = buildHlsBlobUrl(hlsData);
      if (hlsUrl) {
        if (window.Hls && Hls.isSupported()) {
          try {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            const hls = new Hls({ maxBufferLength: 60 });
            hlsInstance = hls;
            hls.on(Hls.Events.ERROR, function (ev, data) {
              if (data && data.fatal) {
                // Fallback ke dlink langsung bila HLS fatal error
                try { hls.destroy(); } catch (_) {}
                hlsInstance = null;
                streamVideo.src = file.dlink;
                streamVideo.load();
                streamVideo.play().catch(() => {});
              }
            });
            hls.loadSource(hlsUrl);
            if (modeEl) modeEl.textContent = 'Mode: HLS (' + (hlsData.chunks.length) + ' segmen via proxy)';
            hls.attachMedia(streamVideo);
            streamVideo.play().catch(() => {});
            return;
          } catch (_) { /* jatuh ke fallback */ }
        } else if (streamVideo.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari: HLS native
          streamVideo.src = hlsUrl;
          streamVideo.play().catch(() => {});
          return;
        }
      }
      if (modeEl) modeEl.textContent = 'Mode: direct link (fallback)';
      // Prioritas 2 (fallback): dlink langsung (cara lama)
      // Coba tanpa Referer dulu: banyak CDN memblokir hotlink dari domain
      // asing tapi mengizinkan request tanpa Referer.
      streamVideo.setAttribute('referrerpolicy', 'no-referrer');
      streamVideo.src = file.dlink;
      streamVideo.play().catch(() => {});
    }

    function closeStream() {
      streamVideo.pause();
      try { if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; } } catch (_) {}
      streamVideo.removeAttribute('src');
      streamVideo.load();
      hideStreamLoading();
      streamModal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.getElementById('streamClose').addEventListener('click', closeStream);
    document.getElementById('modalCloseBtn').addEventListener('click', closeStream);
    document.getElementById('streamBackdrop').addEventListener('click', closeStream);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !streamModal.classList.contains('hidden')) closeStream();
    });
    // Tombol download di dalam player modal (dengan progress bar)
    modalDownloadBtn.addEventListener('click', async () => {
      if (!streamFile) return;
      const ok = await downloadViaHls(streamFile, {
        btn: modalDownloadBtn,
        label: modalDownloadLabel,
        plabel: dlProgressLabel,
        wrap: dlProgressWrap,
        bar: dlProgressBar,
        pct: dlProgressPct,
      });
      if (!ok) {
        streamError.textContent = 'Download gagal. Coba lagi sesaat.';
        streamError.classList.remove('hidden');
      }
    });

    streamVideo.addEventListener('error', () => {
      hideStreamLoading();
      // Fallback: coba sekali lagi dengan Referer normal, siapa tahu
      // CDN-nya justru membutuhkan Referer.
      if (streamFile && !streamRetried) {
        streamRetried = true;
        streamVideo.removeAttribute('referrerpolicy');
        streamVideo.src = streamFile.dlink;
        streamVideo.load();
        streamVideo.play().catch(() => {});
        return;
      }
      streamError.textContent = 'Gagal memuat stream. Link mungkin sudah kedaluwarsa atau dibatasi server — coba buat link baru, atau pakai tombol Download.';
      streamError.classList.remove('hidden');
    });

    // ---------- Form ----------
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = urlInput.value.trim();

      if (!/^https?:\/\//i.test(url)) {
        showError('Masukkan link Terabox yang valid.');
        return;
      }

      setLoading(true);
      currentShareUrl = url;
      currentPath = '';
      pathHistory = [];

      try {
        const response = await fetch('/api/terabox/direct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ url })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok || !data.dlink) {
          throw new Error(data.error || 'Gagal mendapatkan link download.');
        }
        // Simpan data HLS untuk streaming via hls.js
        window._hlsData = data.hls || null;

        const files = (Array.isArray(data.files) && data.files.length
          ? data.files
          : [{ filename: data.filename, size: null, dlink: data.dlink, thumb: data.thumb || null }]
        ).filter((f) => f && f.dlink);
        if (!files.length) {
          throw new Error('Tidak ada link download yang berhasil diekstrak.');
        }
        renderFiles(files);
        resultTitle.textContent = files.length > 1
          ? `${files.length} File Siap Didownload`
          : 'Link Download Siap';
        setLoading(false);
        result.classList.remove('hidden');
        submitBtn.disabled = false;
        btnLabel.textContent = 'Dapatkan Link';
      } catch (error) {
        showError(error.message || 'Terjadi kesalahan jaringan.');
      }
    });

    fileList.addEventListener('click', async (event) => {
      const btn = event.target.closest('.copy-btn');
      if (!btn) return;
      const card = btn.closest('.file-card');
      const input = card ? card.querySelector('.file-link') : null;
      if (!input) return;
      try {
        await navigator.clipboard.writeText(input.value);
        btn.textContent = 'Tersalin';
        setTimeout(() => { btn.textContent = 'Salin'; }, 1200);
      } catch {
        showError('Gagal menyalin link.');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      form.reset();
      result.classList.add('hidden');
      errorBox.classList.add('hidden');
      loading.classList.add('hidden');
      stopLoadingTimer();
      urlInput.focus();
    });
  </script>
</body>
</html>
